<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew7str - AI Workspace</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        
        /* Panel AI Workspace */
        .ai-workspace {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; height: 75%; background: rgba(0, 15, 0, 0.85);
            border: 1px solid #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            display: flex; flex-direction: column; z-index: 100; color: #00ff00;
        }
        .header {
            padding: 10px; border-bottom: 1px dashed #00ff00; display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-weight: bold; letter-spacing: 2px; }
        .status-indicator { font-size: 12px; color: yellow; }
        
        /* Area Chat */
        .chat-history { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px; border-radius: 4px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; }
        .msg.ai { background: rgba(0, 255, 0, 0.1); align-self: flex-start; border-left: 2px solid #00ff00; }
        .msg.user { background: rgba(0, 100, 255, 0.1); align-self: flex-end; border-right: 2px solid #00aaff; color: #00aaff; }
        .msg.system { background: rgba(255, 0, 0, 0.1); align-self: center; border: 1px solid red; color: red; font-size: 14px; width: 90%; text-align: center;}
        
        /* Input Area */
        .input-area { display: flex; padding: 10px; border-top: 1px dashed #00ff00; align-items: center; gap: 10px;}
        input[type="text"], select {
            flex-grow: 1; background: transparent; border: none; color: #00ff00;
            font-family: inherit; font-size: 16px; outline: none;
        }
        button {
            background: rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; color: #00ff00;
            padding: 5px 10px; cursor: pointer; font-family: inherit; font-weight: bold;
        }
        button:hover { background: #00ff00; color: black; }

        /* Settings Modal untuk API KEY */
        .settings-panel {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 10, 0, 0.95); border: 1px solid #00ff00; padding: 20px; z-index: 200; width: 350px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }
        .settings-panel label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
        .settings-panel select, .settings-panel input { 
            width: 100%; box-sizing: border-box; background: #111; border: 1px solid #00ff00; color: #00ff00; padding: 8px; font-family: inherit;
        }
        .btn-save { margin-top: 20px; width: 100%; display: block; }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="ai-workspace">
    <div class="header">
        <span class="header-title" id="terminalTitle">ROBLOX AI TERMINAL</span>
        <div>
            <span class="status-indicator" id="robloxStatus">[ROBLOX: DISCONNECTED]</span>
            <button onclick="toggleSettings()">[API SETTINGS]</button>
        </div>
    </div>
    
    <div class="chat-history" id="chatHistory">
        <div class="msg ai">> System initialized. Menunggu konfigurasi AI...</div>
    </div>
    
    <div class="input-area">
        <span id="promptPrefix">root@workspace:~#</span>
        <input type="text" id="promptInput" placeholder="Ketik prompt modifikasi..." autocomplete="off" onkeypress="handleEnter(event)">
        <button onclick="executePrompt()">[EXECUTE]</button>
    </div>
</div>

<div class="settings-panel" id="settingsPanel">
    <h3 style="margin-top:0; border-bottom: 1px dashed #0f0; padding-bottom: 10px;">Konfigurasi API</h3>
    
    <label for="aiProvider">Penyedia AI:</label>
    <select id="aiProvider" onchange="updateModelDropdown()">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI (ChatGPT)</option>
        <option value="claude">Anthropic (Claude)</option>
    </select>

    <label for="aiModel">Versi Model:</label>
    <select id="aiModel"></select>

    <label for="apiKeyInput">API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="Masukkan API Key...">
    
    <button class="btn-save" onclick="saveSettings()">[SAVE & CLOSE]</button>
</div>

<script>
    // --- MATRIX ANIMATION SCRIPT ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 16; const columns = canvas.width / fontSize;
    const drops = []; for(let x = 0; x < columns; x++) drops[x] = 1;
    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0F0'; ctx.font = fontSize + 'px monospace';
        for(let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // --- AI & SETTINGS LOGIC ---
    // Daftar Model Lengkap
// Daftar Model Generasi Terbaru
    const modelOptions = {
        gemini: [
            { id: "gemini-3.0-pro", name: "Gemini 3 Pro" },
            { id: "gemini-3.0-flash", name: "Gemini 3 Flash" },
            { id: "gemini-2.5-pro", name: "Gemini 2.5 Pro" }
        ],
        openai: [
            { id: "gpt-5.2", name: "GPT-5.2" },
            { id: "gpt-5", name: "GPT-5" },
            { id: "gpt-5-mini", name: "GPT-5 Mini" },
            { id: "gpt-4.1", name: "GPT-4.1" }
        ],
        claude: [
            { id: "claude-4-6-sonnet", name: "Claude Sonnet 4-6" },
            { id: "claude-4-6-opus", name: "Claude Opus 4-6" },
            { id: "claude-4-5-haiku", name: "Claude Haiku 4-5" }
        ]
    };

    let currentProvider = localStorage.getItem('ai_provider') || 'gemini';
    let currentModel = localStorage.getItem('ai_model') || 'gemini-1.5-pro';
    let apiKeys = JSON.parse(localStorage.getItem('api_keys')) || { gemini: '', openai: '', claude: '' };

    function init() {
        document.getElementById('aiProvider').value = currentProvider;
        updateModelDropdown(currentModel);
        updateInterface();
    }

    function updateModelDropdown(preselectedModel = null) {
        const provider = document.getElementById('aiProvider').value;
        const modelSelect = document.getElementById('aiModel');
        modelSelect.innerHTML = ''; // Kosongkan dropdown model
        
        // Isi dropdown model sesuai provider yang dipilih
        modelOptions[provider].forEach(model => {
            const option = document.createElement('option');
            option.value = model.id;
            option.textContent = model.name;
            modelSelect.appendChild(option);
        });

        // Set pilihan sebelumnya jika ada, atau pilih yang pertama dari daftar
        if (preselectedModel && modelOptions[provider].some(m => m.id === preselectedModel)) {
            modelSelect.value = preselectedModel;
        } else {
            modelSelect.value = modelOptions[provider][0].id;
        }
        
        // Update input field untuk API Key
        document.getElementById('apiKeyInput').value = apiKeys[provider] || '';
    }

    function updateInterface() {
        document.getElementById('promptPrefix').innerText = `root@${currentProvider}:~#`;
        document.getElementById('terminalTitle').innerText = `ROBLOX AI TERMINAL (${currentModel.toUpperCase()})`;
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        if (panel.style.display === 'block') {
            document.getElementById('aiProvider').value = currentProvider;
            updateModelDropdown(currentModel);
        }
    }

    function saveSettings() {
        currentProvider = document.getElementById('aiProvider').value;
        currentModel = document.getElementById('aiModel').value;
        apiKeys[currentProvider] = document.getElementById('apiKeyInput').value.trim();
        
        localStorage.setItem('ai_provider', currentProvider);
        localStorage.setItem('ai_model', currentModel);
        localStorage.setItem('api_keys', JSON.stringify(apiKeys));
        
        updateInterface();
        toggleSettings();
        addMessage("system", `> Engine diatur ke: ${currentModel.toUpperCase()}`);
    }

    function addMessage(sender, text) {
        const chat = document.getElementById('chatHistory');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerText = text;
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    function handleEnter(e) { if(e.key === 'Enter') executePrompt(); }

    async function executePrompt() {
        const input = document.getElementById('promptInput');
        const promptText = input.value.trim();
        if(!promptText) return;

        addMessage('user', promptText);
        input.value = '';

        const key = apiKeys[currentProvider];
        if(!key) {
            addMessage('system', `> ERROR: API Key untuk ${currentProvider.toUpperCase()} belum diatur. Klik [API SETTINGS].`);
            return;
        }

        addMessage('ai', `> Memproses dengan ${currentModel}...`);
        
        const systemInstruction = "Kamu adalah asisten ahli Roblox Studio dan Lua scripting. Berikan jawaban yang terstruktur, fokus pada kode, dan jelaskan dengan singkat.";

        try {
            let aiResponse = "";
            
            if (currentProvider === 'gemini') {
                aiResponse = await fetchGemini(promptText, key, systemInstruction, currentModel);
            } else if (currentProvider === 'openai') {
                aiResponse = await fetchOpenAI(promptText, key, systemInstruction, currentModel);
            } else if (currentProvider === 'claude') {
                aiResponse = await fetchClaude(promptText, key, systemInstruction, currentModel);
            }

            addMessage('ai', aiResponse);
            
        } catch (error) {
            addMessage('system', `> SYSTEM ERROR (${currentModel}):\n` + error.message);
        }
    }

    // --- LOGIC API LANGSUNG (TANPA FALLBACK) ---
    async function fetchGemini(prompt, key, systemPrompt, model) {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: systemPrompt + "\n\nPermintaan User:\n" + prompt }] }]
            })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        return data.candidates[0].content.parts[0].text;
    }

    async function fetchOpenAI(prompt, key, systemPrompt, model) {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
            body: JSON.stringify({
                model: model,
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: prompt }
                ]
            })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        return data.choices[0].message.content;
    }

    async function fetchClaude(prompt, key, systemPrompt, model) {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json", 
                "x-api-key": key,
                "anthropic-version": "2023-06-01",
                "anthropic-dangerously-allow-browser": "true" 
            },
            body: JSON.stringify({
                model: model,
                max_tokens: 1024,
                system: systemPrompt,
                messages: [{ role: "user", content: prompt }]
            })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        return data.content[0].text;
    }

    // Inisialisasi awal
    init();
</script>
</body>
</html>
