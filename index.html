<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew7str - AI Workspace</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        
        /* Panel AI Workspace */
        .ai-workspace {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; height: 75%; background: rgba(0, 15, 0, 0.85);
            border: 1px solid #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            display: flex; flex-direction: column; z-index: 100; color: #00ff00;
        }
        .header {
            padding: 10px; border-bottom: 1px dashed #00ff00; display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-weight: bold; letter-spacing: 2px; }
        .status-indicator { font-size: 12px; color: yellow; } /* Kuning = Menunggu koneksi Roblox */
        
        /* Area Chat */
        .chat-history { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px; border-radius: 4px; max-width: 80%; word-wrap: break-word; }
        .msg.ai { background: rgba(0, 255, 0, 0.1); align-self: flex-start; border-left: 2px solid #00ff00; }
        .msg.user { background: rgba(0, 100, 255, 0.1); align-self: flex-end; border-right: 2px solid #00aaff; color: #00aaff; }
        
        /* Input Area */
        .input-area { display: flex; padding: 10px; border-top: 1px dashed #00ff00; align-items: center; gap: 10px;}
        input[type="text"] {
            flex-grow: 1; background: transparent; border: none; color: #00ff00;
            font-family: inherit; font-size: 16px; outline: none;
        }
        button {
            background: rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; color: #00ff00;
            padding: 5px 10px; cursor: pointer; font-family: inherit; font-weight: bold;
        }
        button:hover { background: #00ff00; color: black; }

        /* Settings Modal untuk API KEY */
        .settings-panel {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: black; border: 1px solid #00ff00; padding: 20px; z-index: 200; width: 300px;
        }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="ai-workspace">
    <div class="header">
        <span class="header-title">ROBLOX AI TERMINAL (Gemini Pro)</span>
        <div>
            <span class="status-indicator" id="robloxStatus">[ROBLOX: DISCONNECTED]</span>
            <button onclick="toggleSettings()">[API SETTINGS]</button>
        </div>
    </div>
    
    <div class="chat-history" id="chatHistory">
        <div class="msg ai">> System initialized. Menunggu instruksi...</div>
    </div>
    
    <div class="input-area">
        <span>root@workspace:~#</span>
        <input type="text" id="promptInput" placeholder="Ketik prompt modifikasi..." autocomplete="off" onkeypress="handleEnter(event)">
        <button onclick="sendPrompt()">[EXECUTE]</button>
    </div>
</div>

<div class="settings-panel" id="settingsPanel">
    <h3>Konfigurasi API Key</h3>
    <input type="text" id="apiKeyInput" placeholder="Masukkan Gemini API Key..." style="width: 100%; margin-bottom: 10px; background: #111; border: 1px solid #00ff00; color: #00ff00; padding: 5px;">
    <button onclick="saveApiKey()">[SAVE & CLOSE]</button>
</div>

<script>
    // --- MATRIX ANIMATION SCRIPT ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 16; const columns = canvas.width / fontSize;
    const drops = []; for(let x = 0; x < columns; x++) drops[x] = 1;
    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0F0'; ctx.font = fontSize + 'px monospace';
        for(let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // --- AI & SETTINGS LOGIC ---
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value;
        localStorage.setItem('gemini_api_key', apiKey);
        toggleSettings();
        addMessage("ai", "> API Key berhasil diperbarui.");
    }

    function addMessage(sender, text) {
        const chat = document.getElementById('chatHistory');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerText = text;
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    function handleEnter(e) { if(e.key === 'Enter') sendPrompt(); }

    async function sendPrompt() {
        const input = document.getElementById('promptInput');
        const promptText = input.value.trim();
        if(!promptText) return;

        addMessage('user', promptText);
        input.value = '';

        if(!apiKey) {
            addMessage('ai', "> ERROR: API Key belum diatur. Klik [API SETTINGS].");
            return;
        }

        addMessage('ai', "> Processing with Gemini...");
        
        // Memanggil Gemini API
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Sebagai asisten Roblox Studio Lua, jawablah ini: " + promptText }] }]
                })
            });
            const data = await response.json();
            if(data.error) throw new Error(data.error.message);
            
            const aiResponse = data.candidates[0].content.parts[0].text;
            addMessage('ai', aiResponse);
            
            // Di sini nantinya kita akan mengirim aiResponse ke database perantara agar dibaca oleh Roblox Studio
            
        } catch (error) {
            addMessage('ai', "> SYSTEM ERROR: " + error.message);
        }
    }
</script>
</body>
</html>
